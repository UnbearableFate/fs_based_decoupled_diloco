    evidence:
      - artifacts/duraloco/P08R/20260713_p08r_full_fe82a14_r1/manifest.json
      - artifacts/duraloco/P08R/20260713_p08r_full_fe82a14_r1/stdout.log
      - tracejob_2371957_exit_status_1_walltime_35s
    allocation_nodes: 1
    tests: {passed: 514, failed: 1, skipped: 1}
    authority_created: false
    repair: >-
      Update the state-contract fixture to construct completed P08R evidence and
      require P10 to depend on P08R. Rerun the targeted benchmark and full suite
      on the resulting clean commit before D1 or D2.
    retry_gate: targeted_1node_then_full_1node_same_commit

  - error_id: P08R-E006
    attempt_kind: d1_real_gpt2_qualification
    pbs_job_id: 2371980.opbs
    runtime_commit: 9194a03d660dca97bb748105816e95bf73b5b776
    situation: >-
      The first D1 allocation passed identity and active-surface checks, then
      all three runtime roles rejected configuration before authority
