entries:
  - error_id: P08R-E001
    attempt_kind: control_plane_orchestration
    pbs_job_id: null
    situation: >-
      The first command tried to create and enter the detached validation
      worktree in one tool call while declaring that not-yet-created directory
      as the command working directory.
    outcome: failed_before_submission
    reason: >-
      Process creation resolves the requested working directory before the
      shell can execute git worktree add, so the command could not start and
      qsub was never reached.
    evidence:
      - "exec_command CreateProcess: No such file or directory (os error 2)"
    allocation_nodes: 0
    repair: >-
      Create the detached worktree from the existing repository first, then
      submit from the now-existing validation directory.
    retry_gate: no_compute_qualification_consumed

  - error_id: P08R-E002
    attempt_kind: targeted_1node_real_prefix_replay
    pbs_job_id: 2371888.opbs
    runtime_commit: a265fa9a48974d07c70c3f8fddf924c685e91266
    situation: >-
      The first one-node targeted replay allocation started on mg0008 and
      exited before tests or model/log replay began.
    outcome: wrapper_setup_failure
    reason: >-
      The wrapper used mkdir on the fresh leaf artifact directory without
      first creating its new artifacts/duraloco/P08R parent. mkdir returned
      ENOENT, and the fail-closed fresh-root guard exited with status 2.
    evidence:
      - p08r_replay.o2371888
      - tracejob_2371888_exit_status_2_walltime_1s
    allocation_nodes: 1
    runtime_started: false
    tests_started: false
    repair: >-
      Create only the stable parent with mkdir -p, then retain plain mkdir for
      the unique leaf so namespace reuse still fails closed. Submit from the
      clean detached runtime worktree so PBS_O_WORKDIR binds the tested commit,
      and pass the exact git rev-parse value rather than a manually completed
      abbreviated hash.
    retry_gate: static_bash_n_then_same_1node_targeted_shape

  - error_id: P08R-E003
    attempt_kind: targeted_1node_real_prefix_replay
    pbs_job_id: 2371896.opbs
    runtime_commit: b32bbd49a407b19c4bc70c46ad9dc25a851259fb
    situation: >-
      The repaired one-node wrapper reached the focused compute-node suite on
      mg0009. Fifty-seven tests passed and one P07 snapshot replay accounting
      regression failed before the real-prefix benchmark started.
    outcome: focused_test_failure
    reason: >-
      ProductionTransactionalLog performed the mandatory head/scope preflight
      before replay_snapshot_suffix started its counters. The returned replay
      telemetry therefore reported 14 gets while caller-observed storage
      history correctly contained 15. The replay result and digest were
      correct; the new fail-closed byte attribution contract was incomplete.
      The EXIT trap then exposed a second wrapper defect: the shared manifest
      helper did not yet admit the new P08R phase name, so no manifest was
      created for this failed run.
    evidence:
      - artifacts/duraloco/P08R/20260713_p08r_replay_b32bbd4_r2/stdout.log
      - /work/xg24i002/x10041/duraloco_worktrees/p08r-qualification-1/p08r_replay.o2371896
      - tracejob_2371896_exit_status_1_walltime_10s
    allocation_nodes: 1
    tests: {passed: 57, failed: 1}
    runtime_started: true
    real_prefix_benchmark_started: false
    repair: >-
      Include preflight gets, header bytes, payload bytes, and elapsed time in
      the causal replay call counters, and add P08R to the manifest helper's
      closed phase vocabulary.
    retry_gate: static_checks_then_same_1node_targeted_shape

  - error_id: P08R-E004
    attempt_kind: targeted_1node_real_prefix_replay
    pbs_job_id: 2371905.opbs
    runtime_commit: 668101a8aca3e40bd937dffe23b1b9eb2b03ccb3
    situation: >-
      The third one-node attempt passed all 58 focused tests, completed the
      expensive strict and warm reads of the historical ten-transition GPT-2
      prefix, then failed the benchmark acceptance assertion before writing
      replay_report.json.
    outcome: benchmark_measurement_failure
    reason: >-
      The benchmark interpreted the POSIX backend's aggregate payload_bytes as
      tensor-only bytes. Warm replay correctly reread authoritative manifests
      and head/frontier objects, so aggregate payload bytes were nonzero even
      though cached proposal/params/outer-state payloads were skipped. The
      assertion conflated required metadata replay with forbidden historical
      tensor rereads.
    evidence:
      - artifacts/duraloco/P08R/20260713_p08r_replay_668101a_r3/manifest.json
      - artifacts/duraloco/P08R/20260713_p08r_replay_668101a_r3/stderr.log
      - tracejob_2371905_exit_status_1_walltime_114s
    allocation_nodes: 1
    tests: {passed: 58, failed: 0}
    real_prefix_benchmark_started: true
    real_prefix_report_written: false
    repair: >-
      Attribute logical proposal/params/outer-state validation bytes separately
      from backend-wide manifest and metadata payload bytes. Gate warm replay on
      tensor_payload_bytes=0 while retaining aggregate storage bytes in the raw
      report.
    retry_gate: static_checks_then_same_1node_targeted_shape

