      phase-state files, the active-surface database scan, and 514 repository
      tests with one skip. One repository state-contract test failed.
    outcome: full_suite_test_failure
    reason: >-
      The executable phase checker correctly inserted P08R between P08 and P10,
      but its unit fixture still asserted the historical direct P08-to-P10
      dependency. The fixture had not been extended with P08R's 20 acceptance
