run:
  name: duraloco_milestone_gpt2_9node_50x10
  run_id: null
  shared_root: null
  log_level: INFO

init:
  resume: false
  resume_version: latest
  run_generation: 0
  allow_overwrite_existing_run: false

model:
  name_or_path: gpt2
  trust_remote_code: false
  dtype: bfloat16
  compile: false

data:
  dataset_name: wikitext
  dataset_config_name: wikitext-2-raw-v1
  train_split: train
  validation_split: validation
  block_size: 128
  num_proc: 1
  cache_dir: null
  streaming: false

sync:
  num_learners: 8
  upload_mode: params
  quorum_min: 4
  quorum_max: 8
  max_staleness_versions: 2
  staleness_lambda: 0.2
  selection_policy: oldest_pending
  scan_interval_seconds: 1.0
  grace_window:
    mode: fixed
    fixed_seconds: 5.0
    max_seconds: 5.0
  stop_after_outer_steps: 10
  stop_after_global_tokens: null
  stop_file_poll_seconds: 1.0

liveness:
  heartbeat_interval_seconds: 10.0
  stale_after_seconds: 120.0
  dead_after_seconds: 300.0
  no_progress_timeout_seconds: 900.0
  quorum_policy: fixed

coordination:
  enabled: true
  lease_ttl_seconds: 45.0
  renew_interval_seconds: 10.0
  renew_margin_seconds: 15.0
  max_clock_skew_seconds: 2.0
  standby_poll_seconds: 2.0

training:
  inner_steps: 50
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  block_size: 128
  max_local_steps: null
  precision: bf16
  seed: 1337
  log_every_steps: 10
  grad_clip: 1.0

inner_optimizer:
  name: adamw
  lr: 5.0e-5
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  scheduler: none
  warmup_steps: 0
  reset_on_global_update: true

outer_optimizer:
  name: nesterov
  lr: 0.7
  momentum: 0.9
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8

io:
  tensor_dtype: bfloat16
  atomic_write: true
  compute_sha256: true
  keep_processed_updates: true
  cleanup_applied_after_versions: null
  keep_last_global_versions: 11
  keep_last_learner_update_versions: 1
  final_cleanup_wait_seconds: 5.0

learner:
  poll_latest_during_inner_steps: false
  adopt_global_after_upload: true
  inner_optimizer_adoption_policy: reset_all

failure_sim:
  enabled: false
  sleep_jitter_seconds: 0.0
  upload_skip_probability: 0.0
  crash_probability: 0.0

wandb:
  enabled: false
  mode: offline
  entity: null
  group: duraloco_milestone_gpt2_9node_50x10
  tags:
    - gpt2
    - wikitext-2
    - 9-node
    - 50x10
